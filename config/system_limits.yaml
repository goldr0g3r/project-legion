version: 1
status: provisional
units: SI
station_keeping:
  position_tolerance_m: 0.15
  depth_tolerance_m: 0.10
  yaw_tolerance_deg: 5.0
  settling_time_s: 30.0
  minimum_hold_time_s: 20.0
  abort_position_error_m: 5.0
  abort_attitude_error_deg: 45.0
communication:
  uart_baud: 921600
  state_timeout_ms: 50
  reference_timeout_ms: 500
  heartbeat_timeout_ms: 1000
  rl_timeout_ms: 100
  telemetry_timeout_ms: 500
  maximum_payload_bytes: 256
control:
  plant_rate_hz: 500
  daughter_pid_rate_hz: 100
  state_transport_rate_hz: 100
  rl_inference_rate_hz: 20
  telemetry_rate_hz: 50
  residual_authority_initial: 0.20
  residual_authority_maximum: 0.30
protocol:
  sync_word_hex: A55A
  byte_order: little_endian
  timestamp_width_bits: 32
  sequence_width_bits: 16
  crc:
    name: CRC-32-MPEG-2
    polynomial_hex: 04C11DB7
    initial_hex: FFFFFFFF
    reflect_input: false
    reflect_output: false
    final_xor_hex: '00000000'
evaluation:
  episode_duration_s: 120
  episode_count: 100
  maximum_failure_rate_percent: 5.0
  primary_metric: position_rmse_m
